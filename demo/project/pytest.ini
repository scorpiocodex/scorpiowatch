; Present so pytest's rootdir search stops here.
;
; Without it, pytest walks up to the repository's own pyproject.toml, adopts its
; [tool.pytest.ini_options] (testpaths = tests, --cov=swatch, --cov-fail-under=80), and the
; demo's three tests fail the coverage gate — turning the recorded run red for a reason that
; has nothing to do with the demo. An empty [pytest] section is enough to claim the rootdir.
[pytest]
