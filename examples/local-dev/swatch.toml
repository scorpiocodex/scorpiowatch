# swatch.toml - a runnable, language-neutral local-dev example.
#
# ScorpioWatch watches files and runs commands on change. It is language-agnostic: a trigger
# matches paths by glob and runs any `command` (an argv list) - it knows nothing about
# languages. The active trigger below runs on ANY file change using ScorpioWatch's own CLI as a
# trivial, always-available command, so it works on any project without a toolchain installed -
# and without assuming which interpreter names exist on your machine. Try it:
#
#   cd examples/local-dev
#   uv run swatch run . --config swatch.toml
#   # then, in another terminal, touch a file to see a workflow run:
#   #   echo hi > note.txt
#   # or run a single batch and exit (CI mode, exits 0 on success / 1 on failure):
#   uv run swatch run . --config swatch.toml --once
#
# For a two-language (frontend + backend) config, see ../fullstack/swatch.toml.

[[trigger]]
name = "on-change"
source = "filesystem"
# `**/*` watches every file under this directory (the watcher skips .git, node_modules, and
# the like). Per-trigger cooldown is on by default, so the burst of events one save produces
# collapses to a single run.
patterns = ["**/*"]

  [trigger.workflow]

  # `command` is an argv list run as a subprocess (shell=False) - never a shell string. Replace
  # it with your project's real command, in any language.
  [[trigger.workflow.steps]]
  name = "announce"
  command = ["swatch", "--version"]
  # A step's subprocess starts from an EMPTY environment: only the names listed here are
  # forwarded, so nothing ambient (tokens, keys) leaks into it. PATH is what lets the child find
  # its program at all - drop it and this step fails with "No such file or directory: 'swatch'",
  # because the system default path is not where pipx, uv, or a venv put an installed CLI.
  # PATHEXT/SYSTEMROOT/SystemDrive are the Windows counterparts; names absent on this platform
  # are skipped, so one list works everywhere.
  env_allowlist = ["PATH", "PATHEXT", "SYSTEMROOT", "SystemDrive"]
