# swatch.toml - a two-language (full-stack / monorepo) example.
#
# ScorpioWatch is language-agnostic: each trigger matches paths by glob and runs any `command`
# (an argv list) in its own `cwd`. Here a Node front end and a Python back end live in one
# repo and one config - watched independently, each running its own toolchain's command.
#
# This is a CONFIG example: it demonstrates how the triggers are written. It assumes a repo
# laid out as `frontend/` (Node) and `backend/` (Python); adapt the paths and commands to
# yours. It loads and validates without those toolchains installed - `command` values are just
# argv lists until a matching change actually runs them.
#
# Note (current sharp edge): you name each toolchain explicitly (`npm`, `pytest`), scope it with
# `cwd`, and hand it an environment with `env_allowlist`. A step's child does NOT inherit the
# environment ScorpioWatch runs under - it starts empty, and only the names a step lists reach it
# (see ../../docs/SECURITY_MODEL.md §3). PATH is therefore mandatory for any real command: it is
# what lets the OS find `npm` or `pytest` in the first place. Add whatever else the toolchain
# expects - HOME for npm's and pip's caches, PATHEXT and SYSTEMROOT on Windows, NODE_ENV, and so
# on. Per-trigger environment/toolchain resolution is a v1.1 operability item (see ROADMAP.md).

[[trigger]]
name = "frontend"
source = "filesystem"
patterns = ["frontend/**/*.ts", "frontend/**/*.tsx"]

  [trigger.workflow]

  [[trigger.workflow.steps]]
  name = "test"
  command = ["npm", "test"]
  cwd = "frontend"
  timeout_s = 300
  env_allowlist = ["PATH", "HOME", "PATHEXT", "SYSTEMROOT"]

[[trigger]]
name = "backend"
source = "filesystem"
patterns = ["backend/**/*.py"]

  [trigger.workflow]

  [[trigger.workflow.steps]]
  name = "test"
  command = ["pytest", "-q"]
  cwd = "backend"
  timeout_s = 300
  env_allowlist = ["PATH", "HOME", "PATHEXT", "SYSTEMROOT"]
