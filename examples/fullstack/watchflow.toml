# watchflow.toml - a two-language (full-stack / monorepo) example.
#
# WatchFlow is language-agnostic: each trigger matches paths by glob and runs any `command`
# (an argv list) in its own `cwd`. Here a Node front end and a Python back end live in one
# repo and one config - watched independently, each running its own toolchain's command.
#
# This is a CONFIG example: it demonstrates how the triggers are written. It assumes a repo
# laid out as `frontend/` (Node) and `backend/` (Python); adapt the paths and commands to
# yours. It loads and validates without those toolchains installed - `command` values are just
# argv lists until a matching change actually runs them.
#
# Note (current sharp edge): you name each toolchain explicitly (`npm`, `pytest`) and scope it
# with `cwd`. WatchFlow does not yet resolve a per-trigger environment, so a child inherits the
# environment WatchFlow runs under; per-trigger environment/toolchain resolution is a v1.1
# operability item (see ../../docs/ROADMAP.md).

[[trigger]]
name = "frontend"
source = "filesystem"
patterns = ["frontend/**/*.ts", "frontend/**/*.tsx"]

  [trigger.workflow]
  steps = [
    { name = "test", command = ["npm", "test"], cwd = "frontend", timeout_s = 300 },
  ]

[[trigger]]
name = "backend"
source = "filesystem"
patterns = ["backend/**/*.py"]

  [trigger.workflow]
  steps = [
    { name = "test", command = ["pytest", "-q"], cwd = "backend", timeout_s = 300 },
  ]
